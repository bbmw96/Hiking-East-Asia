name: Deploy to GitHub Pages

# GitHub Pages is the site's only host: this publishes hiking.bbmw0.com on
# every push to main. The repository is public, so Pages is free.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Fork guard. Forking a public repository cannot be blocked, but a fork
    # must not run this workflow: it would publish someone else's copy of the
    # site from their account and burn their Actions minutes doing it. The
    # condition is false in every fork, because github.repository is the
    # fork's own full name.
    if: github.repository == 'bbmw96/Hiking-East-Asia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # enablement:true creates the Pages site on first run. base_path is
      # empty once a custom domain is set in Settings -> Pages (the site is
      # then served from the domain root) and /Hiking-East-Asia before that;
      # Astro needs it at build time so every internal link resolves. Changing
      # the custom domain therefore needs one fresh run of this workflow.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build
        run: npm run build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      # No CNAME file: a site published by an Actions workflow ignores one.
      # The custom domain is the value in Settings -> Pages.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.repository == 'bbmw96/Hiking-East-Asia'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
