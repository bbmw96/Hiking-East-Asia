name: Deploy to GitHub Pages

# The repository is public, so Pages is available on the free plan and this
# publishes on every push to main. GitHub Pages is the second host: Vercel
# serves hiking.bbmw0.com, and this serves the same build from GitHub, so an
# outage at either one leaves the site reachable at the other.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Fork guard. Forking a public repository cannot be blocked, but a fork
    # must not run this workflow: it would publish someone else's copy of the
    # site from their account and burn their Actions minutes doing it. The
    # condition is false in every fork, because github.repository is the
    # fork's own full name.
    if: github.repository == 'bbmw96/Hiking-East-Asia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # enablement:true creates the Pages site on first run, so this needs no
      # manual setup in repository settings. base_path is the subdirectory the
      # site is served from (e.g. /Hiking-East-Asia), which Astro needs at build
      # time so every internal link resolves.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: npm run build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      # A project Pages site with a custom domain serves at the ROOT of that
      # domain rather than at /<repo>/, so the mirror ends up with exactly the
      # same paths as the primary. That removes the need for any path
      # rewriting between the two hosts.
      #
      # Opt-in on purpose. Writing a CNAME before the DNS record exists makes
      # GitHub fail its domain check and takes the mirror offline, so this
      # only fires once the repository variable is set. Set it at
      # Settings -> Secrets and variables -> Actions -> Variables:
      #   PAGES_CUSTOM_DOMAIN = mirror.bbmw0.com
      - name: Claim the custom domain, if one is configured
        if: vars.PAGES_CUSTOM_DOMAIN != ''
        run: echo "${{ vars.PAGES_CUSTOM_DOMAIN }}" > dist/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.repository == 'bbmw96/Hiking-East-Asia'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
