name: Deploy to GitHub Pages

# Manual-only. GitHub Pages cannot be enabled on this repository as it
# stands: Pages on a *private* repo requires a paid plan, and repository
# Settings -> Pages currently reads "Upgrade or make this repository public
# to enable Pages". Until the repo is made public or the plan upgraded, the
# configure-pages step below fails with "Resource not accessible by
# integration", so running this on every push would only produce noise.
# Vercel serves the site in the meantime.
#
# Once Pages is available, add the push triggers back to publish on merge:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # enablement:true creates the Pages site on first run, so this needs no
      # manual setup in repository settings. base_path is the subdirectory the
      # site is served from (e.g. /Hiking-East-Asia), which Astro needs at build
      # time so every internal link resolves.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: npm run build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
