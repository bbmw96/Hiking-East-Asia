name = "hiking-failover"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

# The worker answers for the public hostname. DNS points hiking.bbmw0.com at
# Cloudflare; Cloudflare runs this; this chooses an origin.
routes = [
  { pattern = "hiking.bbmw0.com/*", zone_name = "bbmw0.com" }
]

[vars]
PRIMARY_ORIGIN = "https://hiking-east-asia.vercel.app"
# Once mirror.bbmw0.com is live the mirror serves at its own root, so
# MIRROR_BASE is empty and no path rewriting happens. Until then, point at the
# github.io URL and set MIRROR_BASE = "/Hiking-East-Asia".
MIRROR_ORIGIN = "https://mirror.bbmw0.com"
MIRROR_BASE = ""
PRIMARY_TIMEOUT_MS = "4000"
